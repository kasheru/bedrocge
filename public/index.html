<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEDROC Ground Engineering</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design.css">
<link rel="stylesheet" href="/diagram.css">
<style id="theme-overrides"></style>
<style>
  html{scroll-behavior:smooth}
  body{background:var(--bg)}
  .root{--hl:#F2A869}
  .navlink.current{color:#fff}
  .pimg{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
  .pcard:hover .pimg{transform:scale(1.04)}
  .logo-img{height:76px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);padding:12px}
  .logo-img img{max-width:100%;max-height:100%;object-fit:contain}
  .nfield .err{color:#ffb4a2;font-size:13px}
  .hp{position:absolute;left:-9999px}
  .empty{color:var(--muted);font-size:16px}
  .count::after{content:none!important}
  .mapco:hover rect:first-of-type{stroke-width:2.4}.mapco:focus-visible{outline:2px solid #E8761C}
  .cell .ico{display:block;transition:transform .35s}.cell:hover .ico{transform:translateY(-3px)}
  .root .btn-white{color:#0A2347}
  .root .btn-ghost{color:#fff}
  .root .btn-ghost:hover,#home .tlink:hover{color:var(--hl)}
  .root .tlink:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="root" id="root"></div>
<script src="/diagram.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=(s)=>String(s??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const href=(h)=>esc(/^\s*(javascript|data|vbscript):/i.test(h||'')?'#':(h||'#'));
const num=(i)=>String(i+1).padStart(2,'0');
// *text* -> highlighted span (hero/contact/about) or <strong> (section titles)
const rich=(t,mode)=>esc(t).replace(/\*([^*]+)\*/g,mode==='b'?'<strong>$1</strong>':'<span style="color:var(--'+(mode==='hl'?'hl':'accent')+')">$1</span>');
const on=(o)=>o&&o.visible!==false;
const ICONS={
  layers:'M24 6 L42 15 L24 24 L6 15 Z M6 24 L24 33 L42 24 M6 33 L24 42 L42 33',
  compact:'M24 3 V19 M17 13 L24 20 L31 13 M6 30 L24 39 L42 30 L24 21 L6 30 Z M6 38 L24 46 L42 38',
  grout:'M24 5 C24 5 14 17 14 24 A10 10 0 0 0 34 24 C34 17 24 5 24 5 Z M20 26 A4 4 0 0 0 24 30 M8 40 H40 M12 45 H36',
  slope:'M4 42 L30 8 L44 42 Z M14 30 L24 36 M22 20 L33 26 M10 36 L4 38',
  tunnel:'M6 42 V24 A18 18 0 0 1 42 24 V42 M14 42 V25 A10 10 0 0 1 34 25 V42 M3 42 H45 M24 6 V10',
  bridge:'M3 32 H45 M8 32 V42 M24 32 V42 M40 32 V42 M4 32 C14 12 34 12 44 32 M14 21 V32 M24 17 V32 M34 21 V32',
  shield:'M24 5 L40 11 V24 C40 34 33 41 24 44 C15 41 8 34 8 24 V11 Z M17 24 L22 29 L31 19',
  mountain:'M3 40 L17 16 L25 28 L31 20 L45 40 Z M14 22 L17 26 L20 22'
};
const icon=(n)=>'<svg class="ico" viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(ICONS[n]||ICONS.layers)+'"/></svg>';
const slab=(c)=>`<div class="slab ${c}"><div class="face f-back"></div><div class="face f-left"></div><div class="face f-right"></div><div class="face f-front"></div><div class="face f-top"></div></div>`;
const rings=(cx,cy,rot,rs,a)=>`<svg class="drift" aria-hidden="true" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%"><g fill="none" stroke="rgba(255,255,255,${a})" stroke-width="1">${rs.map(([x,y])=>`<ellipse cx="${cx}" cy="${cy}" rx="${x}" ry="${y}" transform="rotate(${rot} ${cx} ${cy})"></ellipse>`).join('')}</g></svg>`;
const head=(label,title,extra='',lc='')=>`<div class="reveal" style="margin-bottom:clamp(32px,6vh,64px);${extra?'display:flex;flex-wrap:wrap;gap:24px 80px;align-items:flex-end;justify-content:space-between':''}"><div><p class="label" style="margin-bottom:20px;${lc}">${esc(label)}</p><h2 class="h2">${rich(title,'b')}</h2></div>${extra}</div>`;
const cell=(i,t,p,pm)=>`<div class="cell"><span class="n">${num(i)}</span><span class="t">${esc(t)}</span>${p?`<p class="muted" style="margin:${pm||16}px 0 0;font-size:16px;line-height:1.7">${esc(p)}</p>`:''}</div>`;

let C,cap=0,vuln=0;

function render(){
  const s=C.settings||{},h=C.header||{};
  document.title=s.siteTitle||'BEDROC';
  $('meta[name=description]').content=s.metaDescription||'';
  $('#theme-overrides').textContent=`[data-theme="light"]{${s.navyColor?`--navy:${s.navyColor};`:''}${s.accentColor?`--accent:${s.accentColor};`:''}}.root{${s.highlightColor?`--hl:${s.highlightColor};`:''}}`;

  const nav=(h.nav||[]).map(n=>n.enabled!==false?`<a href="${href(n.href)}" class="navlink">${esc(n.label)}</a>`:`<span class="navoff" title="Coming soon">${esc(n.label)}</span>`).join('');
  const mnav=(h.nav||[]).filter(n=>n.enabled!==false).map(n=>`<a href="${href(n.href)}" class="mlink" data-close>${esc(n.label)}</a>`).join('');
  let out=`<header class="hdr"><div class="prog" aria-hidden="true"></div>
  <div class="wrap hdr-in"><a href="#home" style="display:flex;flex-direction:column;gap:5px"><span style="font-size:20px;font-weight:700;letter-spacing:.26em;line-height:1">${esc(h.wordmark)}</span><span style="font-size:9px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:#AEBBCB">${esc(h.subtitle)}</span></a>
  <nav class="nav-links" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 34px">${nav}</nav>
  <div style="display:flex;align-items:center;gap:14px"><div class="seg" role="group" aria-label="Colour theme"><button type="button" class="seg-light" data-theme-set="light">Light</button><button type="button" class="seg-dark" data-theme-set="dark">Dark</button></div>
  <a href="${href(h.ctaHref)}" class="btn btn-ghost hdr-cta">${esc(h.ctaLabel)}</a>
  <button type="button" class="btn btn-ghost menu-btn" id="menuBtn" aria-expanded="false">Menu</button></div></div>
  <nav class="wrap" id="mmenu" hidden style="padding-bottom:16px">${mnav}</nav></header>`;

  const he=C.hero;
  if(on(he))out+=`<section id="home" style="position:relative;background:var(--navy);color:#fff;overflow:hidden;min-height:clamp(560px,calc(100vh - 76px),820px);display:flex;flex-direction:column">
  ${rings(1120,380,-16,[[90,56],[190,122],[300,196],[420,272],[550,350],[690,430]],.06)}
  <div class="wrap" style="position:relative;flex:1;width:100%;box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;gap:24px 48px;padding-top:clamp(32px,6vh,72px);padding-bottom:clamp(32px,6vh,72px)">
   <div style="flex:1 1 520px;min-width:0">
    <p class="label hero-in" style="color:var(--hl);margin-bottom:22px;animation-delay:.1s">${esc(he.eyebrow)}</p>
    <h1 class="h1-in" style="margin:0;font-size:clamp(38px,min(5.6vw,9.6vh),90px);font-weight:300;letter-spacing:-.04em;line-height:1.02;max-width:860px;text-wrap:balance">${rich(he.headline,'hl')}</h1>
    <p class="hero-in" style="margin:24px 0 0;font-size:clamp(15px,1.3vw,18px);line-height:1.65;color:var(--navy-muted);max-width:540px;animation-delay:.45s">${esc(he.intro)}</p>
    <div class="hero-in" style="display:flex;flex-wrap:wrap;align-items:center;gap:20px 36px;margin-top:32px;animation-delay:.6s">
     ${he.ctaLabel?`<a href="${href(he.ctaHref)}" class="btn btn-white">${esc(he.ctaLabel)}</a>`:''}
     ${he.linkLabel?`<a href="${href(he.linkHref)}" class="tlink">${esc(he.linkLabel)} <span aria-hidden="true">→</span></a>`:''}
    </div></div>
   <div class="hero-in" style="flex:1 1 360px;min-width:0;max-width:560px;animation-delay:.5s"><div class="scene" role="img" aria-label="Rotating 3D model of ground strata layers pinned by anchor rods"><div class="scene-in"><div class="stage">
    <div class="plate p1"></div><div class="plate p2"></div><div class="plate p3"></div>${slab('s1')}${slab('s2')}${slab('s3')}
    <div class="rod r1"><i></i><i></i></div><div class="rod r2"><i></i><i></i></div><div class="rod r3"><i></i><i></i></div>
   </div></div></div></div></div>
  <div style="position:relative;border-top:1px solid var(--navy-line)"><div class="wrap" style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;padding-top:20px;padding-bottom:20px">
   <span style="font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--navy-muted)">${esc(he.stripText)}</span>
   <span class="cue" aria-hidden="true"><span class="cue-line"></span>${esc(he.scrollLabel)}</span></div></div></section>`;

  const sec=C.sectors;
  if(on(sec)&&(sec.items||[]).length){const set=`<span class="marq-set">${sec.items.map(i=>`<span>${esc(i)}</span><i></i>`).join('')}</span>`;
    out+=`<div class="marq" aria-hidden="true"><div class="marq-track">${set}${set}</div></div>`}

  const d=C.disciplines;
  if(on(d))out+=`<section class="sec"><div class="wrap">${head(d.label,d.title,d.linkLabel?`<a href="${href(d.linkHref)}" class="tlink">${esc(d.linkLabel)} <span aria-hidden="true">→</span></a>`:'')}
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));column-gap:clamp(32px,4vw,64px)">${(d.items||[]).map((t,i)=>`<div class="cell"><span class="n">${num(i)}</span><span style="display:block;margin-top:22px;color:var(--accent)">${icon(t.icon)}</span><span class="t" style="margin-top:16px">${esc(t.title)}</span></div>`).join('')}</div></div></section>`;

  const a=C.about;
  if(on(a))out+=`<section id="about" class="sec" style="background:var(--bg2)"><div class="wrap">
   <div style="display:flex;flex-wrap:wrap;gap:40px 96px"><div class="reveal" style="flex:0 1 300px;min-width:200px"><p class="label" style="margin-bottom:20px">${esc(a.label)}</p><h2 class="h2">${rich(a.title,'b')}</h2></div>
    <div class="reveal" style="flex:1 1 520px;min-width:0"><p style="margin:0;font-size:clamp(22px,2.5vw,34px);font-weight:300;line-height:1.4;letter-spacing:-.015em">${rich(a.statement).replace(/<span style="color:var\(--accent\)">/g,'<span style="color:var(--accent);font-weight:400">')}</p></div></div>
</div></section>`;

  const cp=C.capabilities;
  if(on(cp)&&(cp.categories||[]).length)out+=`<section id="capabilities" class="sec"><div class="wrap">${head(cp.label,cp.title)}<div id="capBox"></div></div></section>`;

  const dm=C.diagram;
  if(on(dm))out+=`<section id="diagram" class="sec" style="background:#fff;color:#0A2347;border-top:1px solid #E1E6EC"><div class="wrap">
   <div class="reveal" style="margin-bottom:clamp(28px,5vh,52px)"><p class="label" style="margin-bottom:20px;color:#B85009">${esc(dm.label)}</p><h2 class="h2">${rich(dm.title,'b')}</h2>
    <p style="margin:20px 0 0;font-size:17px;line-height:1.7;color:#5B6878;max-width:620px">${esc(dm.intro)}</p></div>
   <div class="dm-wrap reveal" style="border:1px solid #E1E6EC;border-top:1.5px solid #0A2347;background:#fff">
    <div style="border-bottom:1.5px solid #0A2347;padding:14px 20px;font-size:clamp(11px,1.5vw,16px);font-weight:800;letter-spacing:.06em;text-transform:uppercase">${esc(dm.mapTitle)}</div>
    ${dmSvg(dm.labels||[])}</div>
   <button type="button" class="dm-replay" id="dmReplay">Replay animation</button></div></section>`;

  const dg=C.diagnostics;
  if(on(dg)&&(dg.vulnerabilities||[]).length)out+=`<section id="diagnostics" class="sec" style="background:var(--navy);color:#fff"><div class="wrap">
   <div class="reveal" style="display:flex;flex-wrap:wrap;gap:32px 96px;margin-bottom:clamp(32px,6vh,64px)"><div style="flex:0 1 300px;min-width:200px"><p class="label" style="color:var(--hl)">${esc(dg.label)}</p></div>
    <div style="flex:1 1 520px;min-width:0"><h2 class="h2" style="max-width:820px">${rich(dg.title,'b')}</h2><p style="margin:20px 0 0;font-size:16px;line-height:1.7;color:var(--navy-muted);max-width:520px">${esc(dg.intro)}</p></div></div>
   <div id="dgBox"></div><p style="margin:48px 0 0;font-size:12px;letter-spacing:.08em;color:var(--navy-muted)">${esc(dg.footnote)}</p></div></section>`;

  const w=C.why;
  if(on(w))out+=`<section class="sec"><div class="wrap">${head(w.label,w.title)}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));column-gap:clamp(28px,3.4vw,56px)">${(w.items||[]).map((x,i)=>cell(i,x.title,x.text)).join('')}</div></div></section>`;

  const m=C.method;
  if(on(m)){const terms=m.formulaTerms||[],cols=['#2D63A8','#E8761C','#6B7280'];
    out+=`<section id="method" class="sec" style="background:var(--bg2)"><div class="wrap">
   <div style="display:flex;flex-wrap:wrap;gap:56px 96px;align-items:center;margin-bottom:clamp(36px,7vh,80px)">
    <div class="reveal" style="flex:1 1 460px;min-width:0"><p class="label" style="margin-bottom:20px">${esc(m.label)}</p><h2 class="h2" style="margin-bottom:36px">${rich(m.title,'b')}</h2>
     <p style="margin:0;font-size:clamp(24px,3vw,40px);font-weight:300;line-height:1.22;letter-spacing:-.025em">${terms.map(t=>esc(t)).join(' <span class="muted">+</span> ')} <span class="muted">=</span> <span style="color:var(--accent);font-weight:400">${esc(m.formulaResult)}</span></p></div>
    <div class="reveal" style="flex:0 1 380px;min-width:260px"><div style="position:relative;width:min(100%,250px);aspect-ratio:1/1;margin:0 auto">
     <svg viewBox="0 0 200 200" aria-hidden="true" style="width:100%;height:100%;display:block"><circle cx="100" cy="100" r="80" fill="none" stroke="var(--line)" stroke-width="14"></circle><g transform="rotate(-90 100 100)">
      ${terms.slice(0,3).map((t,i)=>`<circle class="rg rg${i+1}" cx="100" cy="100" r="80" stroke="${cols[i]}" stroke-dasharray="153.5 349.15" transform="rotate(${i*120} 100 100)"></circle>`).join('')}</g></svg>
     <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 22%"><span style="font-size:17px;font-weight:500;line-height:1.3;letter-spacing:-.01em">${esc(m.formulaResult)}</span></div></div>
     <div style="display:flex;flex-direction:column;gap:10px;margin-top:28px;font-size:14px">${terms.slice(0,3).map((t,i)=>`<div style="display:flex;align-items:center;gap:12px"><span style="width:12px;height:12px;background:${cols[i]};display:inline-block"></span>${esc(t)}</div>`).join('')}</div></div></div>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));column-gap:clamp(28px,3.4vw,56px)">${(m.points||[]).map((x,i)=>cell(i,x.title,x.text,14)).join('')}</div></div></section>`}

  if(on(sec))out+=`<section class="sec"><div class="wrap">${head(sec.label,sec.title)}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));column-gap:clamp(32px,4vw,64px)">${(sec.items||[]).map((t,i)=>cell(i,t)).join('')}</div></div></section>`;

  const co=C.contact,f=C.footer||{};
  const row=(lbl,val,link,last)=>`<div style="border-top:1px solid var(--navy-line);${last?'border-bottom:1px solid var(--navy-line);':''}padding:24px 0"><span style="display:block;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--navy-muted);margin-bottom:10px">${lbl}</span><a href="${link}" style="font-size:22px;font-weight:300;word-break:break-word">${esc(val)}</a></div>`;
  out+=`<section id="contact" style="position:relative;background:var(--navy);color:#fff;overflow:hidden">${rings(1280,140,-20,[[90,56],[200,128],[320,206],[450,290],[590,376]],.05)}`;
  if(on(co))out+=`<div class="wrap" style="position:relative;padding-top:clamp(56px,10vh,112px);padding-bottom:clamp(40px,7vh,72px)">
   <p class="label reveal" style="color:var(--hl);margin-bottom:32px">${esc(co.label)}</p>
   <p class="reveal" style="margin:0;font-size:clamp(28px,min(4vw,7vh),56px);font-weight:300;line-height:1.12;letter-spacing:-.03em;max-width:1060px">${rich(co.statement,'hl')}</p>
   <div style="display:flex;flex-wrap:wrap;gap:40px 96px;margin-top:clamp(36px,7vh,72px);align-items:flex-start">
    <div style="flex:1 1 340px;min-width:0">${row('Website',co.website,'https://'+esc(String(co.website).replace(/^https?:\/\//,'')))}${row('Email',co.email,'mailto:'+esc(co.email))}${row('Phone',co.phone,'tel:'+esc(String(co.phone).replace(/[^\d+]/g,'')),1)}</div>
    <form id="enq" style="flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:24px" novalidate>
     <div class="nfield"><label for="f-name">${esc(co.formNameLabel)}</label><input id="f-name" name="name" type="text" autocomplete="name" maxlength="120" required></div>
     <div class="nfield"><label for="f-org">${esc(co.formOrgLabel)}</label><input id="f-org" name="organisation" type="text" autocomplete="organization" maxlength="160"></div>
     <div class="nfield"><label for="f-mail">${esc(co.formEmailLabel)}</label><input id="f-mail" name="email" type="email" autocomplete="email" maxlength="160" required></div>
     <div class="nfield"><label for="f-msg">${esc(co.formMessageLabel)}</label><textarea id="f-msg" name="message" rows="3" maxlength="4000" required></textarea></div>
     <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
     <div style="padding-top:8px"><button type="submit" class="btn btn-white">${esc(co.submitLabel)}</button></div>
     <p id="enqMsg" role="status" style="margin:0;font-size:14px;line-height:1.5;color:var(--navy-muted)"></p></form></div></div>`;
  out+=`<div style="position:relative;border-top:1px solid var(--navy-line)"><div class="wrap" style="padding-top:28px;padding-bottom:28px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px">
   <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 20px"><span style="font-size:16px;font-weight:700;letter-spacing:.26em">${esc(f.wordmark)}</span><span style="font-size:12px;color:var(--navy-muted)">${esc(f.copyright)}</span></div>
   <nav style="display:flex;flex-wrap:wrap;gap:8px 28px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase">${(f.links||[]).map(l=>`<a href="${href(l.href)}">${esc(l.label)}</a>`).join('')}${f.adminLabel?`<a href="/admin" style="color:var(--hl)">${esc(f.adminLabel)}</a>`:''}</nav></div></div></section>`;

  $('#root').innerHTML=out;
  bind();renderCap();renderDg();counts();dmInit();
}

function renderCap(){
  const box=$('#capBox');if(!box)return;const cats=C.capabilities.categories,L=(i)=>String.fromCharCode(65+i);
  if(cap>=cats.length)cap=0;
  const total=cats.reduce((n,c)=>n+(c.items||[]).length,0),n=cats.length,seg=360/n,len=502.65,dash=len/n-14;
  box.innerHTML=`<div data-cap="${cap}" style="display:flex;flex-wrap:wrap;gap:48px 96px;align-items:flex-start"><div style="flex:0 1 420px;min-width:260px">
   <div style="position:relative;width:180px;height:180px;margin-bottom:36px"><svg viewBox="0 0 200 200" aria-hidden="true" style="width:100%;height:100%;display:block"><g transform="rotate(-90 100 100)">
    ${cats.map((c,i)=>`<circle cx="100" cy="100" r="80" fill="none" stroke-width="14" style="transition:stroke .4s;stroke:${i===cap?'var(--accent)':'var(--line)'}" stroke-dasharray="${dash.toFixed(1)} ${(len-dash).toFixed(1)}" transform="rotate(${(i*seg+2).toFixed(1)} 100 100)"></circle>`).join('')}</g></svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><span style="font-size:44px;font-weight:200;letter-spacing:-.03em;line-height:1">${total}</span><span class="muted" style="font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin-top:6px">${esc(C.capabilities.donutLabel)}</span></div></div>
   ${cats.map((c,i)=>`<button type="button" class="ctab${i===cap?' ctab-on':''}" aria-pressed="${i===cap}" data-cap-pick="${i}"><span class="clab">${L(i)}</span><span>${esc(c.name)}</span></button>`).join('')}</div>
   <div style="flex:1 1 420px;min-width:0;padding-top:8px">${(cats[cap].items||[]).map((it,i)=>`<div class="crow"><span class="cnum">${L(cap)}${i+1}</span><span class="cname">${esc(it)}</span></div>`).join('')}<div style="border-top:1px solid var(--line)"></div></div></div>`;
  box.querySelectorAll('[data-cap-pick]').forEach(b=>b.onclick=()=>{cap=+b.dataset.capPick;renderCap()});
}
function renderDg(){
  const box=$('#dgBox');if(!box)return;const vs=C.diagnostics.vulnerabilities,cats=(C.capabilities&&C.capabilities.categories)||[];
  if(vuln>=vs.length)vuln=0;const act=vs[vuln].fixes||[];
  box.innerHTML=`<div style="display:flex;flex-wrap:wrap;gap:48px 80px;align-items:flex-start"><div style="flex:0 1 420px;min-width:260px">
   ${vs.map((v,i)=>`<button type="button" class="vtab${i===vuln?' vtab-on':''}" aria-pressed="${i===vuln}" data-v-pick="${i}"><span class="vn">${num(i)}</span><span>${esc(v.name)}</span></button>`).join('')}<div style="border-top:1px solid var(--navy-line)"></div></div>
   <div style="flex:1 1 460px;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:40px">
   ${cats.map((g,gi)=>`<div><div style="display:flex;align-items:baseline;gap:12px;margin-bottom:14px"><span style="font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--hl)">${String.fromCharCode(65+gi)}</span><span style="font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#fff">${esc(g.name)}</span></div>
    ${(g.items||[]).map(it=>`<div class="ix${act.includes(it)?' ix-on':''}"><span class="dot"></span><span>${esc(it)}</span></div>`).join('')}</div>`).join('')}</div></div>`;
  box.querySelectorAll('[data-v-pick]').forEach(b=>{const go=()=>{vuln=+b.dataset.vPick;renderDg()};b.onclick=go;b.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
}
function counts(){
  const els=document.querySelectorAll('[data-count]');
  if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const io=new IntersectionObserver((es)=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);
    const raw=e.target.dataset.count,m=raw.match(/^(\D*)(\d+)(\D*)$/);if(!m)return;const end=+m[2],t0=performance.now();
    const tick=(t)=>{const k=Math.min(1,(t-t0)/1200),v=Math.round(end*(1-Math.pow(1-k,3)));e.target.textContent=m[1]+v+m[3];if(k<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)}),{threshold:.4});
  els.forEach(el=>io.observe(el));
}
function setTheme(t){document.documentElement.dataset.theme=t;document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeSet===t)));try{localStorage.setItem('bedroc-theme',t)}catch{}}
function bind(){
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.onclick=()=>setTheme(b.dataset.themeSet));
  setTheme(document.documentElement.dataset.theme);
  const mb=$('#menuBtn'),mm=$('#mmenu');
  if(mb)mb.onclick=()=>{const o=mm.hidden;mm.hidden=!o;mb.setAttribute('aria-expanded',String(o));mb.textContent=o?'Close':'Menu'};
  document.querySelectorAll('[data-close]').forEach(a=>a.onclick=()=>{mm.hidden=true;mb.textContent='Menu';mb.setAttribute('aria-expanded','false')});
  const form=$('#enq');
  if(form)form.onsubmit=async(e)=>{e.preventDefault();const msg=$('#enqMsg'),fd=Object.fromEntries(new FormData(form));
    if(!fd.name.trim()||!/^\S+@\S+\.\S+$/.test(fd.email)||!fd.message.trim()){msg.textContent='Please enter your name, a valid email and project details.';return}
    form.querySelector('button').disabled=true;
    try{const r=await fetch('/api/enquiry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fd)});
      if(!r.ok)throw new Error((await r.json()).error||'Could not send');form.reset();msg.textContent=C.contact.successMessage}
    catch(er){msg.textContent=er.message}finally{form.querySelector('button').disabled=false}};
}

let saved='';try{saved=localStorage.getItem('bedroc-theme')||''}catch{}
fetch('/api/content').then(r=>r.json()).then(c=>{C=c;document.documentElement.dataset.theme=saved||(c.settings&&c.settings.defaultTheme)||'light';render()});
</script>
